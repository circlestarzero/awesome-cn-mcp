name: verify-registry
on:
  push:
    paths: ["data/registry.json", "scripts/verify.py"]
  pull_request:
  schedule:
    - cron: "17 1 * * 1"   # 每周一 UTC 01:17 复核星数漂移
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: cli/gh-actions/setup@v1
      - name: Verify registry links
        run: python scripts/verify.py
